syntax = "proto3";

package scada.v1;

option go_package = "github.com/example/scada-gas/gen/scada/v1;scadav1";

// DataQuality describes the trustworthiness of a tag value.
enum DataQuality {
  QUALITY_UNKNOWN = 0;
  QUALITY_GOOD = 1;
  QUALITY_BAD_COMM_FAILURE = 2;
  QUALITY_BAD_SENSOR_FAULT = 3;
  QUALITY_BAD_OUT_OF_RANGE = 4;
  QUALITY_MANUAL_OVERRIDE = 5;
}

// AnalogTagValue carries one scaled analog measurement.
message AnalogTagValue {
  string tag_id = 1;            // e.g. TEH_CGS_01_P_IN
  double value = 2;             // calibrated engineering value
  double raw_value = 3;         // raw ADC register integer
  string engineering_unit = 4;  // e.g. PSI, Bar, °C
  DataQuality quality = 5;
  int64 timestamp_utc_ms = 6;
}

// DigitalTagValue carries one boolean status / alarm point.
message DigitalTagValue {
  string tag_id = 1;  // e.g. TEH_CGS_01_LEAK
  bool state = 2;
  DataQuality quality = 3;
  int64 timestamp_utc_ms = 4;
  bool is_soe = 5;    // true when this update is a Sequence-of-Events state change
}

// TelemetryStreamUpdate is one polling-cycle batch sent by a FEP.
message TelemetryStreamUpdate {
  string source_fep_id = 1;
  int64 packet_sequence = 2;
  repeated AnalogTagValue analog_updates = 3;
  repeated DigitalTagValue digital_updates = 4;
}

// StreamAck is returned by the core when the telemetry stream ends.
message StreamAck {
  int64 last_processed_sequence = 1;
  bool is_healthy = 2;
}

service ScadaFepCoreService {
  rpc StreamTelemetry(stream TelemetryStreamUpdate) returns (StreamAck);
}

// ---------------------------------------------------------------------------
// Phase 2: alarm management (ISA-18.2 / IEC 62682) and data distribution
// ---------------------------------------------------------------------------

enum AlarmSeverity {
  SEVERITY_INFO = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
  SEVERITY_CRITICAL = 4;
}

// ISA-18.2 alarm states. An alarm that is acknowledged after returning to
// normal (ALARM_ACK_RTN) is cleared from the active list.
enum AlarmState {
  ALARM_UNACK_ALARM = 0;  // active, not yet acknowledged
  ALARM_ACK_ALARM = 1;    // active, acknowledged
  ALARM_UNACK_RTN = 2;    // returned to normal, not yet acknowledged
  ALARM_ACK_RTN = 3;      // returned to normal and acknowledged (cleared)
}

message AlarmEvent {
  string alarm_id = 1;  // e.g. TEH_CGS_01_P_IN_HH
  string tag_id = 2;
  AlarmSeverity severity = 3;
  AlarmState state = 4;
  string message = 5;
  double trigger_value = 6;
  int64 trigger_time_utc_ms = 7;
  int64 ack_time_utc_ms = 8;
  string ack_by_user = 9;
  int64 rtn_time_utc_ms = 10;  // when the process condition returned to normal
}

message AckAlarmRequest {
  string alarm_id = 1;
  string user = 2;
}

message AckAlarmResponse {
  bool success = 1;
  string message = 2;
  AlarmEvent alarm = 3;  // alarm after the transition (set on success)
}

message GetActiveAlarmsRequest {
  string tag_id = 1;                  // optional: only alarms of this tag
  AlarmSeverity min_severity = 2;     // only alarms at or above this severity
}

message GetActiveAlarmsResponse {
  repeated AlarmEvent alarms = 1;     // sorted by severity, then trigger time
}

message SubscribeRequest {
  string subscriber_id = 1;
}

service ScadaAlarmService {
  rpc AcknowledgeAlarm(AckAlarmRequest) returns (AckAlarmResponse);
  rpc GetActiveAlarms(GetActiveAlarmsRequest) returns (GetActiveAlarmsResponse);
  // Live feed of every alarm state transition (used by the historian).
  rpc SubscribeAlarmEvents(SubscribeRequest) returns (stream AlarmEvent);
}

service ScadaDataService {
  // Live feed of every telemetry batch the core ingests (used by the historian).
  rpc SubscribeTelemetry(SubscribeRequest) returns (stream TelemetryStreamUpdate);
}
