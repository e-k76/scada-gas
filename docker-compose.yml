services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: scada-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: scada
      POSTGRES_PASSWORD: scada
      POSTGRES_DB: scada
    ports:
      - "5432:5432"
    volumes:
      - scada-pgdata:/var/lib/postgresql/data
      - ./deploy/timescaledb_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./deploy/topology_init.sql:/docker-entrypoint-initdb.d/02_topology.sql:ro
      - ./deploy/control_init.sql:/docker-entrypoint-initdb.d/03_control.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada -d scada"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  scada-pgdata:
